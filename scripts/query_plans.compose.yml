services:
  postgres-query-plans:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - name: postgres
        target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 10s
      retries: 30
